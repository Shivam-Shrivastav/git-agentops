[project]
name = "github-agent"
version = "0.1.0"
description = "Local GitHub agent framework using LangGraph, Ollama, and GitHub REST APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60",
  "langchain-core>=0.3.18",
  "langchain-openai>=0.2.10",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.scripts]
github-agent = "github_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["github_agent*"]
