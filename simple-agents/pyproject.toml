[project]
name = "simple-agents"
version = "0.1.0"
description = "Lightweight, privacy-safe agents instrumented with AgentOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "openai>=1.50",
  "httpx>=0.27",
  "ddgs>=9.16",
  "segno>=1.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_agents*"]
