# Stable named tunnel override — use when you have a CF_TUNNEL_TOKEN from
# the Cloudflare Zero Trust dashboard (needs a Cloudflare account + a
# domain managed by Cloudflare). Gives a STABLE public hostname that
# survives restarts, unlike the quick tunnel's random *.trycloudflare URL.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.home.yml \
#     -f docker-compose.home.named.yml up -d
#
# First create the tunnel + public hostname in the dashboard (see
# CLOUDFLARE_DEPLOY.md), then set CF_TUNNEL_TOKEN in .env and run the above.

services:
  cloudflared:
    environment:
      # cloudflared reads this automatically when run with `tunnel run`.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    # Connect to the dashboard-managed tunnel (ingress configured there,
    # e.g. https://agentops.yourdomain.com -> http://caddy:80).
    command: tunnel run