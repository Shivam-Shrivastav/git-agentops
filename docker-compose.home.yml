# Home hosting via Cloudflare Tunnel.
#
# Runs the prod stack on THIS machine and exposes it publicly through an
# OUTBOUND-ONLY tunnel — no open inbound ports, no public IP, no
# router port-forwarding. Cloudflare terminates TLS at its edge and tunnels
# requests to the local Caddy, which serves plain HTTP + basic auth.
#
#   ./home-up.sh        # build + start (reads the tunnel URL from logs)
#   ./home-down.sh      # stop
#
# Default mode: QUICK TUNNEL — instant, no Cloudflare account or domain
# needed. cloudflared prints a random https://*.trycloudflare.com URL in
# its logs (that URL is unguessable and changes on restart).
#
# For a STABLE URL on your own domain: set CF_TUNNEL_TOKEN in .env (from
# the Cloudflare Zero Trust dashboard → Networks → Tunnels → your tunnel →
# "Install and run a connector" → copy the token), then run:
#   docker compose -f docker-compose.prod.yml -f docker-compose.home.yml \
#     up -d cloudflared --force-recreate
# with the cloudflared command overridden to `tunnel run` (see note in
# CLOUDFLARE_DEPLOY.md). The quick tunnel is fine to start with.

services:
  caddy:
    # Tunnel-only exposure: don't map 80/443 to the host/LAN.
    ports: !reset []
    volumes:
      - ./Caddyfile.home:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick tunnel: anonymous, no token. The public URL is printed in the
    # container logs (grep for trycloudflare). Reaches Caddy by service name
    # over the internal compose network — no host port needed.
    command: tunnel --url http://caddy:80
    depends_on:
      - caddy