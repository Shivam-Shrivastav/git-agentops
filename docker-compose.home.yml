# Home hosting via Cloudflare Tunnel.
#
# Runs the prod stack on THIS machine and exposes it publicly through an
# OUTBOUND-ONLY tunnel — no open inbound ports, no public IP, no
# router port-forwarding. Cloudflare terminates TLS at its edge and tunnels
# requests to the local Caddy, which serves plain HTTP + basic auth.
#
#   ./home-up.sh        # build + start
#   ./home-down.sh      # stop
#
# This override switches the prod stack to a NAMED TUNNEL so a custom domain
# (e.g. https://agentops.website) stays stable across restarts. Set
# TUNNEL_TOKEN in .env, create a public hostname in Zero Trust pointing
# to http://caddy:80, and recreate cloudflared.

services:
  caddy:
    # Tunnel-only exposure: don't map 80/443 to the host/LAN.
    ports: !reset []
    volumes:
      - ./Caddyfile.home:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file: .env
    # Named tunnel: stable hostname configured in Cloudflare Zero Trust.
    command: tunnel run
    depends_on:
      - caddy